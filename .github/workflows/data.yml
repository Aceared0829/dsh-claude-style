name: Data

# The price snapshot and the peak rate catalog are scraped once here and
# committed, so every install downloads a validated file instead of asking the
# upstream source for one. The two scripts run in order: the price snapshot takes
# its Chinese public holidays from the catalog. A run that finds nothing new
# writes nothing, and its commit is excluded from CI (paths-ignore), which is
# what keeps a daily refresh from starting a full matrix.
on:
  schedule:
    # Once a day, before the first peak window of the Beijing day.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The scrapers run the host half's own validators through esbuild, so the
      # repository's dev dependencies have to be in place before they run. The
      # browser download is the test lanes' and would only slow this job down.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Refresh the peak rate catalog
        run: node scripts/fetch-peakrate-catalog.mjs
      - name: Refresh the price snapshot
        run: node scripts/fetch-prices.mjs
      - name: Commit a change
        run: |
          if git diff --quiet -- packages/host/data; then
            echo "the data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/host/data
          git commit -m "chore(data): refresh the price and peak rate snapshots"
          git push
